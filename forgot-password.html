<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forget Your Password — Cadenza</title>
  <meta name="description" content="Reset the password of your Cadenza account.">
  <link rel="stylesheet" href="css/main.min.css?v=88">
</head>
<body class="page--light-header page--auth page--reset">
  <div data-include="header"></div>

  <main>
    <!-- ====================================================================
         Forget Your Password
         Frames Figma 494:1109 (desktop) et 544:14416 (mobile)
         ==================================================================== -->
    <div class="auth">
      <div class="auth__media">
        <img class="auth__media-img" src="assets/images/auth-side.jpg" alt="Two models in streetwear at a fashion show">
      </div>

      <div class="auth__panel">
        <form class="auth-form auth-form--reset" novalidate>
          <h1 class="auth-form__title">Forget Your Password</h1>
          <p class="auth-form__subtitle">We will send you an e-mail to reset your password</p>

          <div class="auth-form__field">
            <label class="auth-form__label" for="reset-email">Email / Phone</label>
            <input class="auth-form__input" id="reset-email" type="email" name="email"
                   placeholder="haddou0mohamed@gmail.com" autocomplete="email" required>
          </div>

          <div class="auth-form__actions">
            <button type="submit" class="auth-form__submit">Submit</button>
            <a class="auth-form__cancel" href="login.html">Cancel</a>
          </div>
        </form>
      </div>
    </div>

    <!-- Bande newsletter, reprise à l'identique de l'accueil (494:1097) -->
    <section class="newsletter">
      <img class="newsletter__bg" src="assets/images/newsletter-bg.jpg" alt="">
      <div class="newsletter__overlay"></div>
      <p class="newsletter__eyebrow">Goodbye Deals</p>
      <h2 class="newsletter__title">Never Miss a Moment</h2>
      <p class="newsletter__note">Final day to save: September 30, 2024!</p>
      <form class="newsletter__form">
        <label class="visually-hidden" for="newsletter-email">Email address</label>
        <input class="newsletter__input" type="email" id="newsletter-email" name="email" placeholder="Enter your email" required>
        <button type="submit" class="newsletter__submit">Send</button>
      </form>
    </section>
  </main>

  <div data-include="footer"></div>
  <div data-include="panels"></div>

  <script src="js/includes.js?v=27"></script>
  <script src="js/main.js?v=41"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — Cadenza</title>
  <meta name="description" content="Create your Cadenza account.">
  <link rel="stylesheet" href="css/main.css?v=87">
</head>
<body class="page--light-header page--auth page--signup">
  <div data-include="header"></div>

  <main>
    <!-- ====================================================================
         Create Account — frames Figma 494:906 (desktop) et 544:14290 (mobile)
         ==================================================================== -->
    <div class="auth">
      <div class="auth__media">
        <img class="auth__media-img" src="assets/images/auth-side.jpg" alt="Two models in streetwear at a fashion show">
      </div>

      <div class="auth__panel">
        <form class="auth-form auth-form--signup" novalidate>
          <h1 class="auth-form__title">Create account</h1>
          <p class="auth-form__subtitle">Sign up with your own active email</p>

          <!-- Prénom et nom côte à côte en desktop, empilés en mobile -->
          <div class="auth-form__field auth-form__row">
            <div class="auth-form__col">
              <label class="auth-form__label" for="signup-first-name">First Name</label>
              <input class="auth-form__input" id="signup-first-name" type="text" name="first-name"
                     placeholder="mohamed" autocomplete="given-name" required>
            </div>
            <div class="auth-form__col">
              <label class="auth-form__label" for="signup-last-name">Last Name</label>
              <input class="auth-form__input" id="signup-last-name" type="text" name="last-name"
                     placeholder="haddou" autocomplete="family-name" required>
            </div>
          </div>

          <div class="auth-form__field">
            <label class="auth-form__label" for="signup-email">Email / Phone</label>
            <input class="auth-form__input" id="signup-email" type="email" name="email"
                   placeholder="haddou0mohamed@gmail.com" autocomplete="email" required>
          </div>

          <div class="auth-form__field">
            <label class="auth-form__label" for="signup-password">Password</label>
            <div class="auth-form__control">
              <input class="auth-form__input" id="signup-password" type="password" name="password"
                     placeholder="••••••••" autocomplete="new-password" required>
              <button type="button" class="auth-form__reveal" data-password-toggle
                      aria-controls="signup-password" aria-pressed="false" aria-label="Show password">
                <img src="assets/icons/icon-eye.svg" alt="" width="20" height="18">
              </button>
            </div>
          </div>

          <button type="submit" class="auth-form__submit">Create Account</button>

          <p class="auth-form__switch">If you already have account ? <a href="login.html">Sign In</a></p>
        </form>
      </div>
    </div>

    <!-- Bande newsletter, reprise à l'identique de l'accueil (494:894) -->
    <section class="newsletter">
      <img class="newsletter__bg" src="assets/images/newsletter-bg.jpg" alt="">
      <div class="newsletter__overlay"></div>
      <p class="newsletter__eyebrow">Goodbye Deals</p>
      <h2 class="newsletter__title">Never Miss a Moment</h2>
      <p class="newsletter__note">Final day to save: September 30, 2024!</p>
      <form class="newsletter__form">
        <label class="visually-hidden" for="newsletter-email">Email address</label>
        <input class="newsletter__input" type="email" id="newsletter-email" name="email" placeholder="Enter your email" required>
        <button type="submit" class="newsletter__submit">Send</button>
      </form>
    </section>
  </main>

  <div data-include="footer"></div>
  <div data-include="panels"></div>

  <script src="js/includes.js?v=27"></script>
  <script src="js/main.js?v=41"></script>
</body>
</html>

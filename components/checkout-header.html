<!-- ==========================================================================
     En-tête réduit — Checkout Page (544:13954) : PromoHeader identique au
     site + bandeau minimal (nom + panier), sans navigation ni recherche.
     Injecté via js/includes.js dans <div data-include="checkout-header"></div>
     ========================================================================== -->
<div class="promo-header">
  <div class="promo-header__social">
    <a href="#"><img src="assets/icons/icon-instagram.svg" alt="Instagram" width="18" height="18"></a>
    <a href="#"><img src="assets/icons/icon-facebook.svg" alt="Facebook" width="18" height="18"></a>
    <a href="#"><img src="assets/icons/icon-youtube.svg" alt="YouTube" width="18" height="18"></a>
    <a href="#"><img src="assets/icons/icon-whatsapp.svg" alt="WhatsApp" width="18" height="18"></a>
  </div>
  <div class="promo-header__slider">
    <button type="button" class="promo-header__slider-btn" data-promo-prev aria-label="Previous offer">
      <img src="assets/icons/icon-chevron-left.svg" alt="" width="24" height="24">
    </button>
    <p class="promo-header__slider-text">New customers 10% off with WELCOME</p>
    <button type="button" class="promo-header__slider-btn" data-promo-next aria-label="Next offer">
      <img src="assets/icons/icon-chevron-right.svg" alt="" width="24" height="24">
    </button>
  </div>
  <div class="promo-header__settings">
    <div class="dropdown" data-dropdown>
      <button type="button" class="promo-header__setting-btn" data-dropdown-toggle aria-haspopup="true" aria-expanded="false">
        <span data-dropdown-value>English</span>
        <img src="assets/icons/icon-chevron-down.svg" alt="" width="16" height="16">
      </button>
      <ul class="dropdown__list" data-dropdown-list hidden>
        <li><button type="button" class="dropdown__item is-active" data-dropdown-option>English</button></li>
        <li><button type="button" class="dropdown__item" data-dropdown-option>Chinese</button></li>
        <li><button type="button" class="dropdown__item" data-dropdown-option>Spanish</button></li>
        <li><button type="button" class="dropdown__item" data-dropdown-option>French</button></li>
        <li><button type="button" class="dropdown__item" data-dropdown-option>Hindi</button></li>
        <li><button type="button" class="dropdown__item" data-dropdown-option>Russian</button></li>
        <li><button type="button" class="dropdown__item" data-dropdown-option>Bengali</button></li>
        <li><button type="button" class="dropdown__item" data-dropdown-option>Arabic</button></li>
        <li><button type="button" class="dropdown__item" data-dropdown-option>Portuguese</button></li>
      </ul>
    </div>
    <div class="dropdown" data-dropdown>
      <button type="button" class="promo-header__setting-btn" data-dropdown-toggle aria-haspopup="true" aria-expanded="false">
        <span data-dropdown-value>USD</span>
        <img src="assets/icons/icon-chevron-down.svg" alt="" width="16" height="16">
      </button>
      <ul class="dropdown__list" data-dropdown-list hidden>
        <li><button type="button" class="dropdown__item is-active" data-dropdown-option data-short="USD">United States, USD</button></li>
        <li><button type="button" class="dropdown__item" data-dropdown-option data-short="EUR">Eurozone, EUR</button></li>
        <li><button type="button" class="dropdown__item" data-dropdown-option data-short="JPY">Japan, JPY</button></li>
        <li><button type="button" class="dropdown__item" data-dropdown-option data-short="GBP">United Kingdom, GBP</button></li>
        <li><button type="button" class="dropdown__item" data-dropdown-option data-short="AUD">Australia, AUD</button></li>
        <li><button type="button" class="dropdown__item" data-dropdown-option data-short="CAD">Canada, CAD</button></li>
        <li><button type="button" class="dropdown__item" data-dropdown-option data-short="CHF">Switzerland, CHF</button></li>
        <li><button type="button" class="dropdown__item" data-dropdown-option data-short="CNY">China, CNY</button></li>
      </ul>
    </div>
  </div>
</div>

<header class="checkout-header">
  <a href="index.html" class="checkout-header__logo">Cadenza</a>
  <a href="cart.html" class="checkout-header__cart" data-panel-open="cart" aria-label="Panier">
    <img src="assets/icons/icon-header-cart.svg" alt="" width="24" height="24">
    <span class="checkout-header__cart-badge" data-cart-badge>2</span>
  </a>
</header>

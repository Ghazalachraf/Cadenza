<!-- ==========================================================================
     Shared Header — PromoHeader (top bar) + main nav
     Injected via js/includes.js into <div data-include="header"></div>
     ========================================================================== -->
<div class="promo-header">
  <div class="promo-header__social">
    <a href="#"><img src="assets/icons/icon-instagram.svg" alt="Instagram" width="18" height="18"></a>
    <a href="#"><img src="assets/icons/icon-facebook.svg" alt="Facebook" width="18" height="18"></a>
    <a href="#"><img src="assets/icons/icon-youtube.svg" alt="YouTube" width="18" height="18"></a>
    <a href="#"><img src="assets/icons/icon-whatsapp.svg" alt="WhatsApp" width="18" height="18"></a>
  </div>
  <div class="promo-header__slider">
    <button type="button" class="promo-header__slider-btn" data-promo-prev aria-label="Previous offer">
      <img src="assets/icons/icon-chevron-left.svg" alt="" width="24" height="24">
    </button>
    <p class="promo-header__slider-text">New customers 10% off with WELCOME</p>
    <button type="button" class="promo-header__slider-btn" data-promo-next aria-label="Next offer">
      <img src="assets/icons/icon-chevron-right.svg" alt="" width="24" height="24">
    </button>
  </div>
  <div class="promo-header__settings">
    <button type="button" class="promo-header__setting-btn">
      English
      <img src="assets/icons/icon-chevron-down.svg" alt="" width="16" height="16">
    </button>
    <button type="button" class="promo-header__setting-btn">
      USD
      <img src="assets/icons/icon-chevron-down.svg" alt="" width="16" height="16">
    </button>
  </div>
</div>

<header class="site-header">
  <nav class="site-header__menu" aria-label="Main navigation">
    <a href="index.html" class="site-header__link">Home</a>
    <a href="shop.html" class="site-header__link">Shop</a>
    <button type="button" class="site-header__link site-header__link--dropdown">
      New Arrivals
      <img src="assets/icons/icon-chevron-down.svg" alt="" width="16" height="16">
    </button>
    <button type="button" class="site-header__link site-header__link--dropdown">
      Collection
      <img src="assets/icons/icon-chevron-down.svg" alt="" width="16" height="16">
    </button>
    <a href="about.html" class="site-header__link">About</a>
  </nav>

  <a href="index.html" class="site-header__logo">
    <img src="assets/icons/logo.svg" alt="Cadenza" width="157" height="30">
  </a>

  <div class="site-header__actions">
    <button type="button" class="site-header__link">Search</button>
    <a href="login.html" class="site-header__link">Sign in</a>
    <a href="cart.html" class="site-header__link site-header__bag">

    </a>
  </div>

  <div class="site-header__mobile-icons">
    <a href="login.html" aria-label="Mon compte">

    </a>
    <a href="cart.html" aria-label="Panier">
      <img src="assets/icons/icon-cart-mobile.svg" alt="" width="18" height="18">
    </a>
  </div>
</header>
